[project]
name = "netshift"
version = "1.5.0"
description = "Modern Windows GUI to manage network adapter IP configurations, presets and network tools."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["customtkinter>=5.2", "pystray>=0.19", "pillow>=10"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Topic :: System :: Networking",
    "Intended Audience :: System Administrators",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# la langue est fixée au démarrage : _() en valeur par défaut est évalué une seule fois, volontairement
extend-immutable-calls = ["netshift.i18n._"]

[tool.pytest.ini_options]
testpaths = ["tests"]
