name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build NetShift.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed --uac-admin --name NetShift
          --icon assets/netshift.ico --add-data "assets;assets" --collect-all customtkinter
          NetShift.pyw
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/NetShift.exe -Algorithm SHA256).Hash
          "$h  NetShift.exe" | Out-File dist/NetShift.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: NetShift
          path: dist/NetShift.exe*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NetShift.exe
            dist/NetShift.exe.sha256
          generate_release_notes: true
