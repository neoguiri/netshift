name: Bug report / Signaler un bug
description: Something does not work as expected / Quelque chose ne fonctionne pas
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please remove sensitive data (internal IPs, hostnames, MACs) before posting.
        Merci ! Pense à masquer les données sensibles (IP internes, noms de machines, MAC).
  - type: textarea
    id: what
    attributes:
      label: What happened? / Que s'est-il passé ?
      description: Steps to reproduce, expected vs actual result.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (Historique & journal → Journal)
      render: text
  - type: input
    id: version
    attributes:
      label: NetShift version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: run
    attributes:
      label: How do you run it? / Comment le lances-tu ?
      options: ["NetShift.exe (release)", "From source / depuis les sources"]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
